version: "3.9"

services:
  rag_api:
    build:
      context: ./rag  # Changed context
      dockerfile: Dockerfile
    container_name: rag_api
    ports:
      - "8010:8010"
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - project-network

  streamlit_app:
    build:
      context: ./interface_app  # Changed context
      dockerfile: Dockerfile
    container_name: streamlit_app
    ports:
      - "8501:8501"
    depends_on:
      rag_api:
        condition: service_healthy
    environment:
      # Complete database connection details
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
    networks:
      - project-network

networks:
  project-network:
    driver: bridge