version: "3.9"
# prod set up. I pull the latest tagged image (sapientsapiens/capstone-rag-api:latest) from my Docker Hub account which I pushed from my dev machine.
services:
  rag_api:
    image: sapientsapiens/capstone-rag-api:latest
    container_name: rag_api
    ports:
      - "8001:8010"  # Host:8001 → Container:8010
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/"]  # ✅ Container port
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sidd-network

  postgresql:
    image: postgres:15-alpine
    container_name: sidd_postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DATABASE_NAME}  # From .env: "postgres"
      - POSTGRES_USER=${DATABASE_USER}  # From .env: "postgres"
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}  # Required, from .env
    volumes:
      - sidd_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Host:5433 → Container:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]  # Uses .env
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sidd-network

networks:
  sidd-network:
    driver: bridge

volumes:
  sidd_pgdata:
    driver: local